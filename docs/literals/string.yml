title: "String"
description: |
  Strings can be written with double or single quotes, and the two differ in
  how they treat escapes.

  A **double-quoted** string processes escape sequences: `\"` for a quote,
  `\n` for a newline, `\t` for a tab, `\r` for a carriage return.

  ```js
  puts("test\"string")   // test"string
  puts("a\tb")           // a<tab>b
  ```

  A **single-quoted** string is raw: nothing is escaped and a backslash is an
  ordinary character. This makes it convenient for text containing double
  quotes.

  ```js
  puts('test "string"')  // test "string"
  puts('a\tb')           // a\tb, a literal backslash and t
  ```

  Because a single-quoted string performs no escaping, it cannot contain a
  single quote at all -- `'test \'string'` is a parse error. Use a
  double-quoted string when you need one.
example: |
  a = "test_string";

  b = "test" + "_string";

  is_true = "test" == "test";
  is_false = "test" == "string";

  s = "abcdef"
  puts(s[2])
  puts(s[-2])
  puts(s[:2])
  puts(s[:-2])
  puts(s[2:])
  puts(s[-2:])
  puts(s[1:-2])

  s[2] = "C"
  s[-2] = "E"
  puts(s)

  // should output
  "c"
  "e"
  "ab"
  "abcd"
  "cdef"
  "ef"
  "bcd"
  "abCdEf"

  // you can also use single quotes
  'test "string" with doublequotes'

  // and you can scape a double quote in a double quote string
  "te\"st" == 'te"st'
methods:
  codepoints:
    description: "Returns the character codes of the string, always as an array with one entry per character. A single-character string gives a one-element array and an empty string gives an empty array, so the result never has to be checked for its type before use."
    input: |
      "".codepoints()
      "a".codepoints()
      "abc".codepoints()
    output: |
      []
      [97]
      [97, 98, 99]
  capitalize:
    description: "Returns a copy with the first character upcased and every following character downcased, as Ruby's `capitalize` does. A capital in the middle of the string is therefore lost."
    input: |
      a = "hello World!"
      a.capitalize()
      a
    output: |
      "hello World!"
      "Hello world!"
      "hello World!"
  capitalize!:
    description: "Upcases the first character and downcases the rest in place, and returns the string, so calls can be chained."
    input: |
      a = "hello World!"
      a.capitalize!()
      a
    output: |
      "hello World!"
      "Hello world!"
      "Hello world!"
  trim_line_end:
    description: "Returns a copy with one trailing line ending removed: `\\r\\n`, `\\n` or `\\r`. Given a string it removes one trailing occurrence of that string instead. Given `\"\"` it removes every trailing `\\n` and `\\r\\n`, which is the way to drop blank lines at the end of a file."
    input: |
      a = "line\n"
      a.trim_line_end()
      a.trim_line_end() == "line"
      "abcdd".trim_line_end("d")
      "a\n\n\n".trim_line_end("")
    output: |
      "line\n"
      "line"
      true
      "abcd"
      "a"
  trim_line_end!:
    description: "Removes one trailing line ending in place and returns the string, so calls can be chained. Takes the same optional separator as `trim_line_end`."
    input: |
      a = "line\n"
      a.trim_line_end!()
      a
    output: |
      "line\n"
      "line"
      "line"
  remove_last:
    description: "Returns a copy with the last character removed. A trailing `\\r\\n` is removed as a unit so a line ending is never left half there. Removing the last character of an empty string gives an empty string rather than an error."
    input: |
      a = "abcd"
      a.remove_last()
      a
      "".remove_last()
    output: |
      "abcd"
      "abc"
      "abcd"
      ""
  remove_last!:
    description: "Removes the last character in place and returns the string, so calls can be chained."
    input: |
      a = "abcd"
      a.remove_last!()
      a
    output: |
      "abcd"
      "abc"
      "abc"
  count:
    description: "Counts how often a given substring occurs in the string."
    input: |
      "test".count("t")
    output: |
      2
  lowercase:
    description: "Returns a copy with all uppercase letters replaced by their lowercase counterparts."
    input: |
      a = "TEST"
      a.lowercase()
      a
    output: |
      "TEST"
      "test"
      "TEST"
  lowercase!:
    description: "Replaces uppercase characters with their lowercase counterparts in place and returns the string, so calls can be chained."
    input: |
      a = "TEST"
      a.lowercase!()
      a
    output: |
      "TEST"
      "test"
      "test"
  empty?:
    description: "Returns `true` when the string has no characters."
    input: |
      "".empty?()
      " ".empty?()
    output: |
      true
      false
  ends_with?:
    description: "Returns `true` when the string ends with any of the given strings."
    input: |
      "test.rl".ends_with?(".rl")
      "test.rl".ends_with?(".go")
      "test.rl".ends_with?(".go", ".rl")
    output: |
      true
      false
      true
  index_of:
    description: "Returns the character index of the first occurrence of a given string if found. Otherwise returns `-1`"
    input: |
      "test".index_of("e")
    output: |
      1
  last_index_of:
    description: "Returns the character index of the last occurrence of a given string if found. Otherwise returns `-1`"
    input: |
      "hello".last_index_of("l")
      "hello".last_index_of("z")
    output: |
      3
      -1
  format:
    description: "Formats according to a format specifier and returns the resulting string"
    input: |
      "%s is %d".format("a", 1)
    output: |
      "a is 1"
  include?:
    description: "Returns `true` when the string contains the given substring."
    input: |
      "test".include?("es")
      "test".include?("xy")
    output: |
      true
      false
  lines:
    description: "Splits the string at newline escape sequence and return all chunks in an array. Shorthand for `string.split(\"\\n\")`."
    input: |
      "a\nb".lines()
    output: |
      ["a", "b"]
  trim_start:
    description: "Returns a copy with leading whitespace removed. See `trim_end` for the trailing end and `trim` for both."
    input: |
      a = "  test  "
      a.trim_start()
      a
    output: |
      "  test  "
      "test  "
      "  test  "
  trim_start!:
    description: "Removes leading whitespace in place and returns the string, so calls can be chained."
    input: |
      a = "  test  "
      a.trim_start!()
      a
    output: |
      "  test  "
      "test  "
      "test  "
  replace:
    description: "Returns a copy with every occurrence of the first string replaced by the second. This is Ruby's `gsub` with plain strings rather than Ruby's `replace`."
    input: |
      a = "test"
      a.replace("t", "f")
      a
    output: |
      "test"
      "fesf"
      "test"
  replace!:
    description: "Replaces every occurrence of the first string with the second in place and returns the string, so calls can be chained."
    input: |
      a = "test"
      a.replace!("t", "f")
      a
    output: |
      "test"
      "fesf"
      "fesf"
  reverse:
    description: "Returns a copy of the string with all characters reversed."
    input: |
      a = "stressed"
      a.reverse()
      a
    output: |
      "stressed"
      "desserts"
      "stressed"
  reverse!:
    description: "Reverses the characters in place and returns the string, so calls can be chained."
    input: |
      a = "stressed"
      a.reverse!()
      a
    output: |
      "stressed"
      "desserts"
      "desserts"
  trim_end:
    description: "Returns a copy with trailing whitespace removed. See `trim_start` for the leading end and `trim` for both."
    input: |
      a = "  test  "
      a.trim_end()
      a
    output: |
      "  test  "
      "  test"
      "  test  "
  trim_end!:
    description: "Removes trailing whitespace in place and returns the string, so calls can be chained."
    input: |
      a = "  test  "
      a.trim_end!()
      a
    output: |
      "  test  "
      "  test"
      "  test"
  size:
    description: "Returns the amount of characters in the string."
    input: |
      "test".size()
    output: |
      4
  split:
    description: "Splits the string on a given seperator and returns all the chunks in an array. Default seperator is `\" \"`"
    input: |
      "a b".split()
      "a-b".split("-")
    output: |
      ["a", "b"]
      ["a", "b"]
  starts_with?:
    description: "Returns `true` when the string starts with any of the given strings."
    input: |
      "test.rl".starts_with?("test")
      "test.rl".starts_with?("prod")
      "test.rl".starts_with?("prod", "test")
    output: |
      true
      false
      true
  trim:
    description: "Returns a copy with leading and trailing whitespace removed."
    input: |
      a = "  test  "
      a.trim()
      a
    output: |
      "  test  "
      "test"
      "  test  "
  trim!:
    description: "Removes leading and trailing whitespace in place and returns the string, so calls can be chained."
    input: |
      a = "  test  "
      a.trim!()
      a
    output: |
      "  test  "
      "test"
      "test"
  swap_case:
    description: "Returns a copy with every uppercase character lowercased and every lowercase character uppercased."
    input: |
      a = "Hello World"
      a.swap_case()
      a
    output: |
      "Hello World"
      "hELLO wORLD"
      "Hello World"
  swap_case!:
    description: "Swaps the case of every character in place and returns the string, so calls can be chained."
    input: |
      a = "Hello World"
      a.swap_case!()
      a
    output: |
      "Hello World"
      "hELLO wORLD"
      "hELLO wORLD"
  uppercase:
    description: "Returns a copy with all lowercase letters replaced by their uppercase counterparts."
    input: |
      a = "test"
      a.uppercase()
      a
    output: |
      "test"
      "TEST"
      "test"
  uppercase!:
    description: "Replaces lowercase characters with their uppercase counterparts in place and returns the string, so calls can be chained."
    input: |
      a = "test"
      a.uppercase!()
      a
    output: |
      "test"
      "TEST"
      "TEST"
