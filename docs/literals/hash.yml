title: "Hash"
description: |
  Hash keys are not restricted to strings. Any hashable value works, and a
  single hash may mix key types freely: `STRING`, `INTEGER`, `FLOAT`,
  `BOOLEAN`, `ARRAY` and `HASH`.

  ```js
  h = {"a": 1, 2: true, 3.5: "float", true: "bool", [1, 2]: "array"}

  print(h["a"])     // 1
  print(h[2])       // true
  print(h[3.5])     // "float"
  print(h[true])    // "bool"
  print(h[[1, 2]])  // "array"
  ```

  `NIL` and functions are not hashable and are rejected as keys, with
  `unusable as hash key: NIL` and `expected index to be hashable`
  respectively.

  Reading a key that is not present returns `nil`.

  ## Calling a value stored in a hash

  > 👉 Introduced in `0.24`

  A value under a name can be read with a dot, and a **callable** value under a
  name can be *called* with one:

  ```js
  h = {"double": def(x) return x * 2 end}

  print(h.double(21))     // 42
  print(h["double"](21))  // the same thing
  ```

  That makes a hash of functions read like the object it already is. The functions
  close over the locals of whatever built the hash, so the state is private and
  each one is independent:

  ```js
  def new_account(owner, balance)
    return {
      "owner":    owner,
      "deposit":  def(n) balance = balance + n return balance end,
      "describe": def() return owner + ": " + balance.to_string() end
    }
  end

  a = new_account("robert", 100)
  b = new_account("someone", 0)

  print(a.deposit(50))   // 150
  print(a.describe())    // "robert: 150"
  print(b.describe())    // "someone: 0"
  print(a.owner)         // "robert" -- plain data, read the same way
  ```

  A real hash method always wins, so a hash of data cannot take over `size` or
  `keys`. The stored value is still reachable by index:

  ```js
  h = {"size": def() return 99 end}

  print(h.size())      // 1  -- the hash method
  print(h["size"]())   // 99 -- the stored function
  ```

  A name holding something that cannot be called says so, and a name that is not
  there at all reports a missing method as before:

  ```js
  h = {"n": 1}

  h.n()      // ERROR: `n` is not callable for HASH, it is INTEGER
  h.other()  // ERROR: undefined method `.other()` for HASH
  ```

  This is not a class. The hash is still a `HASH`, so `type()` says `HASH`,
  `methods()` lists the hash's own methods rather than the stored ones, and there
  is no `self` or inheritance. What it adds is the call syntax for a pattern the
  language could already express.
example: |
  people = [{"name": "Anna", "age": 24}, {"name": "Bob", "age": 99}];

  // reassign of values
  h = {"a": 1, 2: true}
  print(h["a"])
  print(h[2])
  h["a"] = 3
  h["b"] = "moo"
  print(h["a"])
  print(h["b"])
  print(h[2])

  // should output
  1
  true
  3
  moo
  true
methods:
  compact:
    description: "Returns a new hash without the entries whose value is `nil`. The hash itself is unchanged; use `compact!` to remove them in place."
    input: |
      h = {"a": nil}
      h.compact().size()
      h.size()
    output: |
      {"a": nil}
      0
      1
  compact!:
    description: "Removes the entries whose value is `nil` in place and returns the hash, so calls can be chained."
    input: |
      h = {"a": nil}
      h.compact!().size()
      h.size()
    output: |
      {"a": nil}
      0
      0
  remove:
    description: "Returns a new hash without the entry for `key`, leaving the hash itself unchanged. A key that is not there comes back unchanged rather than erroring. Use `remove!` to delete in place."
    input: |
      h = {"a": 1}
      h.remove("a")
      h.size()
    output: |
      {"a": 1}
      {}
      1
  remove!:
    description: "Deletes the entry for `key` in place and returns the hash, so calls can be chained."
    input: |
      h = {"a": 1}
      h.remove!("a")
      h.size()
    output: |
      {"a": 1}
      {}
      0
  empty?:
    description: "Returns `true` when the hash has no entries."
    input: |
      {}.empty?()
      {"a": 1}.empty?()
    output: |
      true
      false
  get:
    description: |
      Returns the value for `key`, or `nil` when the key is absent. Pass a
      second argument to get that instead of `nil`. Use `fetch` when a missing
      key is a mistake rather than an expected case.
    input: |
      h = {"a": 1}
      h.get("a")
      h.get("z")
      h.get("z", 0)
    output: |
      {"a": 1}
      1
      nil
      0
  fetch:
    description: |
      Returns the value for `key`, and raises when the key is absent. Use
      `get` when a missing key is an expected case.
    input: |
      h = {"a": 1}
      h.fetch("a")
    output: |
      {"a": 1}
      1
  has_key?:
    description: "Returns `true` when the hash has an entry under the given key. The argument has to be usable as a key, which is what `HASHABLE` in the signature means: a `STRING`, `INTEGER`, `FLOAT`, `BOOLEAN`, `ARRAY` or `HASH`."
    input: |
      {"a": 1, 1: "b"}.has_key?(1)
      {"a": 1, 1: "b"}.has_key?("c")
    output: |
      true
      false
  invert:
    description: "Returns a new hash with keys and values swapped. Values that repeat collapse into one entry, and which one survives is not defined. A value that cannot be a key is an error."
    input: |
      h = {"a": 1}
      h.invert().get(1, "missing")
    output: |
      {"a": 1}
      "a"
  keys:
    description: "Returns the keys of the hash. The order is **not** defined and can differ between runs of the same program, so sort the result if you need it stable."
    input: |
      {"a": "1"}.keys()
      {"a": "1", "b": "2"}.keys().sort()
    output: |
      ["a"]
      ["a", "b"]
  merge:
    description: "Returns a new hash with the entries of both. The argument wins where a key is in both. The hash itself is unchanged; use `merge!` to merge in place."
    input: |
      h = {"a": 1}
      h.merge({"b": 2}).size()
      h.size()
      h.merge({"a": 9}).get("a", 0)
    output: |
      {"a": 1}
      2
      1
      9
  merge!:
    description: "Merges the given hash in place and returns the hash, so calls can be chained."
    input: |
      h = {"a": 1}
      h.merge!({"b": 2}).size()
      h.size()
    output: |
      {"a": 1}
      2
      2
  size:
    description: "Returns the number of entries."
    input: |
      h = {"a": 1}
      h.size()
      {}.size()
    output: |
      {"a": 1}
      1
      0
  values:
    description: "Returns the values of the hash, in the same unspecified order as `keys`."
    input: |
      {"a": "1"}.values()
      {"a": "1", "b": "2"}.values().sort()
    output: |
      ["1"]
      ["1", "2"]
  each:
    description: "Calls the callback once per entry with the key and the value, and returns the hash so calls can be chained. The order the entries arrive in is **not** defined and differs between runs, the same caveat `keys` carries -- use it for a side effect per entry, not to build something ordered."
    input: |
      h = {"a": 1}
      h.each(def(key, value) print(key + "=" + value.to_string()) end)
    output: |
      {"a": 1}
      a=1
      {"a": 1}
  filter:
    description: "Returns a new hash of the entries the callback said yes to. The callback receives the key and the value. Only `false` and `nil` are no. Use `filter!` to filter in place."
    input: |
      h = {"a": 1}
      h["b"] = 2
      h.filter(def(k, v) v > 1 end).size()
      h.size()
    output: |
      {"a": 1}
      2
      1
      2
  filter!:
    description: "Keeps only the entries the callback said yes to and returns the hash, so calls can be chained."
    input: |
      h = {"a": 1}
      h["b"] = 2
      h.filter!(def(k, v) v > 1 end).size()
      h.size()
    output: |
      {"a": 1}
      2
      1
      1
  reject:
    description: "Returns a new hash of the entries the callback said no to -- the mirror of `filter`. Use `reject!` to filter in place."
    input: |
      h = {"a": 1}
      h["b"] = 2
      h.reject(def(k, v) v > 1 end).size()
    output: |
      {"a": 1}
      2
      1
  reject!:
    description: "Drops the entries the callback said yes to and returns the hash, so calls can be chained."
    input: |
      h = {"a": 1}
      h["b"] = 2
      h.reject!(def(k, v) v > 1 end).size()
    output: |
      {"a": 1}
      2
      1
  transform_values:
    description: "Returns a new hash with each value replaced by what the callback answered for it. The keys are untouched. Use `transform_values!` to replace them in place."
    input: |
      h = {"a": 1}
      h.transform_values(def(v) v * 10 end).get("a", 0)
      h.get("a", 0)
    output: |
      {"a": 1}
      10
      1
  transform_values!:
    description: "Replaces each value with what the callback answered and returns the hash, so calls can be chained."
    input: |
      h = {"a": 1}
      h.transform_values!(def(v) v * 10 end).get("a", 0)
    output: |
      {"a": 1}
      10
  transform_keys:
    description: "Returns a new hash with each key replaced by what the callback answered for it. A new key still has to be `HASHABLE`, and two keys answering the same collapse into one entry -- which of them survives is not defined. Use `transform_keys!` to replace them in place."
    input: |
      h = {"a": 1}
      h.transform_keys(def(k) k.uppercase() end).get("A", 0)
    output: |
      {"a": 1}
      1
  transform_keys!:
    description: "Replaces each key with what the callback answered and returns the hash, so calls can be chained."
    input: |
      h = {"a": 1}
      h.transform_keys!(def(k) k.uppercase() end).get("A", 0)
    output: |
      {"a": 1}
      1
