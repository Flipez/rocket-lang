methods:
  is_a?:
    description: "Returns `true` when the value is of the given type or belongs to the given type group, so one question covers both. The name has to be one that exists: anything else is an error rather than a `false`, because a typo would otherwise read as a real answer. See [Types and type groups](../language/types)."
    input: |
      nil.is_a?("NIL")
      "a".is_a?("HASHABLE")
      nil.is_a?("HASHABLE")
      true.is_a?("INTEGERABLE")
      "a".is_a?("INTEGER")
    output: |
      true
      true
      false
      true
      false
  type_groups:
    description: "Returns the type groups the value belongs to, sorted. `ANY` is not listed: every value belongs to it, so it would say nothing while prefixing every answer. It exists for signatures, where `append(ANY)` means the argument accepts anything, and `is_a?(\"ANY\")` still answers `true`. See [Types and type groups](../language/types) for what each group means."
    input: |
      1.type_groups()
      nil.type_groups()
      def() end.type_groups()
      puts.type_groups()
    output: |
      ["COMPARABLE", "HASHABLE", "INTEGERABLE", "NUMERIC", "STRINGABLE"]
      ["STRINGABLE"]
      ["CALLABLE"]
      ["CALLABLE"]
  methods:
    description: "Returns the names of the methods specific to this literal type, not including the generic methods listed on this page. The names are sorted, so the result is the same on every run. A type with no methods of its own returns an empty array."
    input: |
      1.0.methods().contains?("round")
      true.methods()
    output: |
      true
      []
  nil?:
    description: "Returns `true` only for `nil`. Reads better than comparing against `nil` at the end of a chain, and every type answers it."
    input: |
      nil.nil?()
      1.nil?()
      "".nil?()
      [].first().nil?()
    output: |
      true
      false
      false
      true
  to_float:
    description: "Converts an object to its float representation, or `nil` when it cannot. A `nil` result is what distinguishes a failed conversion from a genuine `0.0`."
    input: |
      1.to_float()
      "1.4".to_float()
      "abc".to_float()
      nil.to_float()
    output: |
      1.0
      1.4
      nil
      nil
  to_integer:
    description: "Converts an object to its integer representation, or `nil` when it cannot. A `nil` result is what distinguishes a failed conversion from a genuine `0`. For strings a `0b`, `0o` or `0x` prefix selects binary, octal or hexadecimal and is matched case insensitively, a leading zero followed only by octal digits is octal, and anything else is decimal. The resulting integer keeps the base it was parsed with, and integers of differing bases cannot be combined directly."
    input: |
      true.to_integer()
      false.to_integer()
      1234.to_integer()
      "4".to_integer()
      "0".to_integer()
      "0125".to_integer()
      "0x2322".to_integer()
      "0b1010".to_integer()
      "test".to_integer()
    output: |
      1
      0
      1234
      4
      0
      0o125
      0x2322
      0b1010
      nil
  to_json:
    description: "Returns the object as json notation."
    input: |
      a = {"test": 1234}
      a.to_json()
    output: |
      {"test": 1234}
      "{\"test\":1234}"
  to_string:
    description: "Converts an object to its string representation, or the empty string when it has none. Takes no arguments; an integer renders in its own base, so use `to_base` first to change it."
    input: |
      true.to_string()
      1234.to_string()
      "test".to_string()
      1.4.to_string()
      nil.to_string()
      "0b1010".to_integer().to_string()
    output: |
      "true"
      "1234"
      "test"
      "1.4"
      ""
      "0b1010"
  type:
    description: "Returns the type of the object."
    input: |
      "test".type()
    output: |
      "STRING"
  help:
    description: "Prints the type's literal-specific methods with their argument and return types, sorted by name, one per line. It returns `nil` rather than the listing: this exists to be read, and the REPL echoes a returned value through its escaped representation, which would put the whole thing on one line. Use `methods` when the names are wanted as data. A type with no methods of its own prints only the heading."
    input: |
      true.help()
      1.0.help()
    output: |
      BOOLEAN supports the following methods:
      nil
      FLOAT supports the following methods:
      	abs()
      	ceil([INTEGER])
      	divmod(FLOAT)
      	finite?()
      	floor([INTEGER])
      	infinite?()
      	nan?()
      	negative?()
      	positive?()
      	round([INTEGER])
      	truncate([INTEGER])
      	zero?()
      nil
  wat:
    description: |
      An alias of `help`, kept as an easter egg. This is the only alias in
      RocketLang; every other method has exactly one name.
    input: |
      true.wat()
      1.0.wat()
    output: |
      BOOLEAN supports the following methods:
      nil
      FLOAT supports the following methods:
      	abs()
      	ceil([INTEGER])
      	divmod(FLOAT)
      	finite?()
      	floor([INTEGER])
      	infinite?()
      	nan?()
      	negative?()
      	positive?()
      	round([INTEGER])
      	truncate([INTEGER])
      	zero?()
      nil
